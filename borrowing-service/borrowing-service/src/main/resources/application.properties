spring.application.name=borrowing-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/borrow_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=a
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Resilience4j circuit breaker configuration
resilience4j.circuitbreaker.instances.borrowBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.borrowBreaker.failure-rate-threshold=50

#temporary for debug
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG